<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmad Fabrix - Shop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#fffaf8}
header{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 5%;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{font-size:24px;font-weight:900;color:#4a0a2e}
.logo span{color:#d61b60}
nav a{margin:0 10px;text-decoration:none;color:#333;font-weight:700;font-size:15px}
.cart-btn{background:#7a184a;color:#fff;padding:8px 18px;border-radius:25px;cursor:pointer;font-size:14px}
h2.title{text-align:center;color:#7a184a;margin:25px 0 10px;font-size:26px}
.products{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;padding:15px 5%}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px #0001;text-align:center;padding-bottom:14px;border:1px solid #f0e0e8}
.card img{width:100%;height:360px;object-fit:cover;object-position:top center;display:block}
.card h3{margin:10px 0 4px;font-size:15px;color:#333}
.price{color:#d61b60;font-weight:800;margin:6px 0;font-size:15px}
.btn{padding:6px 12px;border-radius:20px;border:1px solid #7a184a;background:#fff;color:#7a184a;cursor:pointer;font-size:12px;margin:3px}
.btn-fill{background:#7a184a;color:#fff}
@media (max-width:768px){
  .products{grid-template-columns:1fr 1fr !important;gap:10px;padding:10px 3%}
  .card img{height:230px !important}
}
</style>
</head>
<body>

<header>
<div class="logo">Ahmad <span>Fabrix</span></div>
<nav>
<a href="index.html">Home</a>
<a href="shop.html" style="color:#d61b60;border-bottom:2px solid #d61b60">Shop</a>
<a href="about.html">About</a>
<a href="delivery.html">Delivery</a>
<a href="contact.html">Contact</a>
</nav>
<div class="cart-btn" onclick="openCart()">Cart 🛒 (<span id="cartCount">0</span>)</div>
</header>

<h2 class="title">Our Complete Collection - 18 Premium Suits</h2>

<div class="products" id="productList"></div>

<div style="background:#0f0f2d;color:#fff;text-align:center;padding:15px;margin-top:20px;font-size:14px">Free Delivery | JazzCash/Easypaisa 03275213308 | WhatsApp 03275213308</div>

<script>
// 18 Products
let products = [];
for(let i=1;i<=18;i++){
  products.push({id:i, name:`Premium Suit ${i}`, price:3250, img:`pic${i}.jpg`});
}

let cart = JSON.parse(localStorage.getItem('ahmadCart') || '[]');
updateCartCount();

function renderProducts(){
  let html = '';
  products.forEach(p=>{
    html += `<div class="card">
      <img src="${p.img}" onerror="this.src='pic1.jpg'">
      <h3>${p.name}</h3>
      <div class="price">Rs. ${p.price}</div>
      <button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>
      <button class="btn btn-fill" onclick="shopNow(${p.id})">Shop Now</button>
    </div>`;
  });
  document.getElementById('productList').innerHTML = html;
}
renderProducts();

function addToCart(id){
  let item = products.find(p=>p.id===id);
  cart.push(item);
  localStorage.setItem('ahmadCart', JSON.stringify(cart));
  updateCartCount();
  alert(item.name + " Cart me add ho gaya!");
}

function updateCartCount(){
  document.getElementById('cartCount').innerText = cart.length;
}

function shopNow(id){
  let item = products.find(p=>p.id===id);
  let msg = `Assalam o Alaikum Ahmad Fabrix! Mujhe ${item.name} chahiye. Price Rs. ${item.price}. Image: ${item.img}`;
  let wa = `https://wa.me/923275213308?text=${encodeURIComponent(msg)}`;
  window.open(wa, '_blank');
}

function openCart(){
  if(cart.length===0){ alert("Cart khali hai! Pehle Add to Cart karein."); return; }
  let list = cart.map(c=>c.name).join('\n');
  let total = cart.length * 3250;
  if(confirm(list + "\n\nTotal: Rs. "+total+"\n\nWhatsApp par order bhejna hai?")){
    let msg = `Order: \n${list}\nTotal Rs. ${total}`;
    window.open(`https://wa.me/923275213308?text=${encodeURIComponent(msg)}`, '_blank');
  }
}
</script>

</body>
</html>
