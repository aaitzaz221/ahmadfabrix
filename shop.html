<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - Ahmad Fabrix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff8f5}
header{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 5%;box-shadow:0 2px 15px #0001;position:sticky;top:0;z-index:100}
.logo{font-size:22px;font-weight:900;color:#8b2252}
.logo span{color:#d61b60}
nav a{margin:0 10px;text-decoration:none;color:#333;font-weight:600}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 5%}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 15px #0001;text-align:center;padding-bottom:15px}
.card img{width:100%;height:300px;object-fit:cover}
.card h3{margin:10px 0 5px;font-size:16px}
.price{color:#d61b60;font-weight:800;margin:8px 0}
.btn{padding:7px 14px;border-radius:20px;border:1px solid #8b2252;background:#fff;color:#8b2252;cursor:pointer}
.btn-fill{background:#8b2252;color:#fff}
@media (max-width:768px){
  .card img{height:190px !important}
  .card h3{font-size:13px !important}
}
</style>
</head>
<body>
<header><div class="logo">Ahmad <span>Fabrix</span></div><nav><a href="index.html">Home</a> <a href="shop.html">Shop</a> <a href="login.html">Login</a></nav></header>
<div class="products">
<div class="card"><img src="pic1.jpg"><h3>Suit 1</h3><div class="price">Rs. 3250</div><button class="btn">Add to Cart</button> <button class="btn btn-fill">Shop Now</button></div>
<div class="card"><img src="pic2.jpg"><h3>Suit 2</h3><div class="price">Rs. 3250</div><button class="btn">Add to Cart</button> <button class="btn btn-fill">Shop Now</button></div>
<div class="card"><img src="pic3.jpg"><h3>Suit 3</h3><div class="price">Rs. 3250</div><button class="btn">Add to Cart</button> <button class="btn btn-fill">Shop Now</button></div>
<div class="card"><img src="pic4.jpg"><h3>Suit 4</h3><div class="price">Rs. 3250</div><button class="btn">Add to Cart</button> <button class="btn btn-fill">Shop Now</button></div>
</div>
</body>
</html>
